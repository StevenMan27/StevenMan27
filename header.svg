<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Connect">
  <defs>
    <linearGradient id="rgbRule" gradientUnits="userSpaceOnUse" x1="80" y1="95" x2="820" y2="95">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FF0055" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#FF0055;#FFAA00;#00FF88;#00E5FF;#6366F1;#FF00AA;#FF0055" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#6366F1;#FF00AA;#FF0055;#FFAA00;#00FF88;#00E5FF" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#FF00AA" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#FF00AA;#FF0055;#FFAA00;#00FF88;#00E5FF;#6366F1;#FF00AA" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>

    <filter id="hglow" x="-40%" y="-140%" width="180%" height="380%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="orbGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#hglow)">
    <text x="450.0" y="50" text-anchor="middle"
          font-family="'Fira Code','JetBrains Mono',ui-monospace,monospace"
          font-size="30" font-weight="700" letter-spacing="9" fill="#ffffff">CONNECT</text>
  </g>

  <text x="450.0" y="76" text-anchor="middle"
        font-family="'Fira Code',ui-monospace,monospace"
        font-size="11.5" letter-spacing="3.8" fill="#38bdf8">
    // ESTABLISHING UPLINK &#8212; CHRISTIAN STEVEN MANURUNG
  </text>

  <rect x="80" y="94" width="740" height="2" rx="1" fill="url(#rgbRule)" opacity="0.45" filter="url(#hglow)"/>
  <rect x="80" y="94.5" width="740" height="1.2" rx="0.6" fill="url(#rgbRule)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <g filter="url(#orbGlow)">
    <circle cx="150.0" cy="95.1" r="2.6" fill="#ffffff">
      <animate attributeName="cx" values="150.0;750.0;150.0" dur="5s"
               calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
