<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Connect">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="rgbBorderHeader" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="900" y2="60">
      <stop offset="0%" stop-color="#FF0000">
        <animate attributeName="stop-color" values="#FF0000;#FFFF00;#00FF00;#00FFFF;#0000FF;#FF00FF;#FF0000" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" stop-color="#00FF00">
        <animate attributeName="stop-color" values="#00FF00;#00FFFF;#0000FF;#FF00FF;#FF0000;#FFFF00;#00FF00" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" stop-color="#0000FF">
        <animate attributeName="stop-color" values="#0000FF;#FF00FF;#FF0000;#FFFF00;#00FF00;#00FFFF;#0000FF" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#FF0000;#FFFF00;#00FF00;#00FFFF;#0000FF;#FF00FF" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 450 60" to="360 450 60" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF00FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="hglow" x="-40%" y="-140%" width="180%" height="380%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="hsoft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="hgrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#38bdf8" stroke-width="0.4" opacity="0.06"/>
    </pattern>
  </defs>

  <rect x="3" y="3" width="894" height="114" rx="14" fill="url(#hb)"/>
  <rect x="3" y="3" width="894" height="114" rx="14" fill="url(#hgrid)"/>

  <rect x="3" y="3" width="894" height="114" rx="14" fill="none" stroke="url(#rgbBorderHeader)" stroke-width="5" opacity="0.35" filter="url(#hsoft)"/>
  <rect x="3" y="3" width="894" height="114" rx="14" fill="none" stroke="url(#rgbBorderHeader)" stroke-width="3"/>

  <g filter="url(#hglow)">
    <text x="450.0" y="48" text-anchor="middle"
          font-family="'Fira Code','JetBrains Mono',ui-monospace,monospace"
          font-size="30" font-weight="700" letter-spacing="9" fill="#ffffff">CONNECT</text>
  </g>

  <text x="450.0" y="74" text-anchor="middle"
        font-family="'Fira Code',ui-monospace,monospace"
        font-size="11.5" letter-spacing="3.5" fill="#38bdf8">
    // ESTABLISHING UPLINK &#8212; CHRISTIAN STEVEN MANURUNG
  </text>

  <rect x="80" y="92" width="740" height="1.6" fill="url(#rule)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <g fill="#00FFFF">
    <circle cx="150.0" cy="92.8" r="2.4">
      <animate attributeName="cx" values="150.0;750.0;150.0"
               dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
