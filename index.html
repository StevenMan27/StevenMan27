<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christian Steven Manurung — Interactive GitHub Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 28px 16px 56px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .full-svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .social-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 820px;
    }
    .social-grid a {
      display: inline-block;
      transition: transform 0.2s ease;
    }
    .social-grid a:hover { transform: translateY(-2px); }
    .social-grid img {
      height: 78px;
      width: auto;
      display: block;
    }

    /* Spotify Mobile Card */
    .sp-wrap {
      width: 100%;
      max-width: 390px;
      margin-top: 16px;
      padding: 6px;
      position: relative;
    }
    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes spinRgb { to { --angle: 360deg; } }
    .sp-glow {
      position: absolute;
      inset: 4px;
      border-radius: 30px;
      background: conic-gradient(from var(--angle, 0deg), #1DB954, #00E5FF, #6366F1, #FF00AA, #FF0055, #FFAA00, #1DB954);
      animation: spinRgb 4s linear infinite;
      z-index: 0;
    }
    .sp-glow::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 32px;
      background: inherit;
      filter: blur(12px);
      opacity: 0.45;
      z-index: -1;
    }
    .sp-card {
      position: relative;
      z-index: 1;
      border-radius: 28px;
      background: linear-gradient(180deg, #223254 0%, #17223a 48%, #0d1117 100%);
      padding: 22px 26px 24px;
      border: 1.5px solid transparent;
      background-clip: padding-box;
    }
    .sp-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 18px;
    }
    .sp-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      position: relative;
      box-shadow: 0 12px 26px rgba(0,0,0,0.55);
      margin-bottom: 24px;
    }
    .sp-cover-left {
      width: 50%;
      background: #050507;
      position: relative;
    }
    .sp-cover-right {
      width: 50%;
      background: #3b4e83;
    }
    .sp-vert {
      position: absolute;
      left: 14px;
      top: 12px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 13px;
      line-height: 1;
      color: #ffffff;
      text-align: center;
      pointer-events: none;
    }
    .sp-cover-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial Black', sans-serif;
      font-weight: 900;
      font-size: 27px;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    .sp-black {
      color: #3b4e83;
      -webkit-text-stroke: 0.9px #ffffff;
    }
    .sp-amp {
      color: #ffffff;
      margin: 0 3px;
    }
    .sp-blue {
      color: #050507;
      -webkit-text-stroke: 0.9px #ffffff;
    }

    .sp-lyric {
      min-height: 26px;
      font-size: 16.5px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
      transition: opacity 0.2s ease;
    }
    .sp-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .sp-title {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
    }
    .sp-artist {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .sp-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #1DB954;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sp-prog-bar {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      cursor: pointer;
      position: relative;
    }
    .sp-prog-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 999px;
      position: relative;
    }
    .sp-prog-fill::after {
      content: "";
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255,255,255,0.7);
    }
    .sp-times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-top: 7px;
      margin-bottom: 14px;
    }

    .sp-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .sp-icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 6px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sp-icon-btn:hover { opacity: 1; }
    .sp-play-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #0d1117;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(255,255,255,0.25);
      transition: transform 0.15s ease;
    }
    .sp-play-btn:hover { transform: scale(1.06); }

    .sp-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sp-device {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #1DB954;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .sp-hint {
      text-align: center;
      font-size: 11.5px;
      color: #94a3b8;
      margin-top: 12px;
      font-family: 'Fira Code', ui-monospace, monospace;
    }

    #yt-audio-host {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: -9999px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="full-svg" src="./hero.svg" alt="Christian Steven Manurung Hero Card" />
    <img class="full-svg" src="./skills.svg" alt="Tech Stack Arsenal" />
    <img class="full-svg" src="./header.svg" alt="Connect Header" />

    <div class="social-grid">
      <a href="https://www.linkedin.com/in/your-username"><img src="./linkedin.svg" alt="LinkedIn" /></a>
      <a href="https://t.me/your-username"><img src="./telegram.svg" alt="Telegram" /></a>
      <a href="https://x.com/your-username"><img src="./x.svg" alt="X / Twitter" /></a>
      <a href="https://instagram.com/your-username"><img src="./instagram.svg" alt="Instagram" /></a>
      <a href="https://hackster.io/your-username"><img src="./hackster.svg" alt="Hackster" /></a>
      <a href="https://www.threads.net/@your-username"><img src="./threads.svg" alt="Threads" /></a>
    </div>

    <!-- Interactive Spotify Card -->
    <div id="player" class="sp-wrap">
      <div class="sp-glow"></div>
      <div class="sp-card">
        <div class="sp-top">
          <span>⌄</span>
          <span>Shape of my heart holic</span>
          <span>•••</span>
        </div>

        <div class="sp-cover">
          <div class="sp-cover-left">
            <div class="sp-vert">
              <span>B</span><span>A</span><span>C</span><span>K</span><span>S</span><span>T</span><span>R</span><span>E</span><span>E</span><span>T</span>
              <span style="margin-top:8px;">B</span><span>O</span><span>Y</span><span>S</span>
            </div>
          </div>
          <div class="sp-cover-right"></div>
          <div class="sp-cover-title">
            <span class="sp-black">BLACK</span><span class="sp-amp">&amp;</span><span class="sp-blue">BLUE</span>
          </div>
        </div>

        <div id="lyricLine" class="sp-lyric">Loneliness is tragical</div>

        <div class="sp-meta-row">
          <div>
            <div class="sp-title">Shape of My Heart</div>
            <div class="sp-artist">Backstreet Boys</div>
          </div>
          <div class="sp-check">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0d1117" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>

        <div id="progressBar" class="sp-prog-bar" title="Seek">
          <div id="progressFill" class="sp-prog-fill"></div>
        </div>
        <div class="sp-times">
          <span id="elapsedTime">0:00</span>
          <span id="remainingTime">-3:51</span>
        </div>

        <div class="sp-controls">
          <button id="restartBtn" class="sp-icon-btn" title="Shuffle / Restart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
          <button id="prevBtn" class="sp-icon-btn" title="Restart Track">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="3" height="14" rx="1"/><polygon points="20 5 20 19 8 12"/></svg>
          </button>
          <button id="playPauseBtn" class="sp-play-btn" aria-label="Play or Pause">
            <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button id="nextBtn" class="sp-icon-btn" title="Next">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="4 5 4 19 16 12"/><rect x="17" y="5" width="3" height="14" rx="1"/></svg>
          </button>
          <button class="sp-icon-btn" style="color:#1DB954;" title="Repeat On">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>

        <div class="sp-bottom">
          <div class="sp-device">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1DB954" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="1" y1="20" x2="23" y2="20"/></svg>
            <span>STEVENM</span>
          </div>
          <div style="display:flex;gap:14px;color:#cbd5e1;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </div>
        </div>

        <div id="audioHint" class="sp-hint">Klik tombol Play / di mana saja untuk mendengar suara 🔊</div>
      </div>
    </div>
  </div>

  <div id="yt-audio-host"><div id="yt-player"></div></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const VIDEO_ID = "OT5gsOkUPkk";
    const LYRICS = [
      [0, "♪ Shape of My Heart — Intro"],
      [12.6, "Baby, please try to forgive me"],
      [19.9, "Stay here, don't put out the glow"],
      [29.8, "Hold me now, don't bother"],
      [33.9, "If every minute it makes me weaker"],
      [38.2, "You can save me"],
      [41.7, "From the man that I've become"],
      [48.4, "Looking back on the things I've done"],
      [53.2, "I was tryin' to be someone"],
      [58.0, "I played my part"],
      [60.6, "And kept you in the dark"],
      [63.9, "Now let me show you the shape of my heart"],
      [72.1, "Sadness is beautiful"],
      [77.2, "Loneliness is tragical"],
      [81.6, "So help me, I can't win this war"],
      [92.2, "Touch me now, don't bother"],
      [96.4, "If every second it makes me weaker"],
      [100.7, "You can save me"],
      [104.1, "From the man I've become"],
      [110.8, "Looking back on the things I've done"],
      [115.7, "I was tryin' to be someone"],
      [120.2, "I played my part"],
      [123.1, "And kept you in the dark"],
      [126.0, "Now let me show you the shape of my heart"],
      [132.7, "I'm here with my confession"],
      [137.2, "Got nothin' to hide no more"],
      [141.5, "I don't know where to start"],
      [146.3, "But to show you the shape of my heart"],
      [157.4, "I'm looking back on things I've done"],
      [162.5, "I never wanna play the same old part"],
      [168.1, "Or keep you in the dark"],
      [172.3, "Now let me show you the shape of my heart"],
      [177.1, "Looking back on the things I've done"],
      [180.9, "I was tryin' to be someone"],
      [185.2, "I played my part"],
      [188.0, "And kept you in the dark"],
      [191.2, "Now let me show you the shape of my heart"],
      [197.0, "Looking back on the things I've done"],
      [200.6, "I was tryin' to be someone"],
      [205.1, "I played my part"],
      [208.1, "And kept you in the dark"],
      [211.1, "Now let me show you the shape of my heart"],
      [217.0, "Show you the shape of my heart"]
    ];

    let player = null;
    let isPlaying = false;
    let playerReady = false;
    let userWantedPlay = false;

    const lyricLine = document.getElementById("lyricLine");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const elapsedTime = document.getElementById("elapsedTime");
    const remainingTime = document.getElementById("remainingTime");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const prevBtn = document.getElementById("prevBtn");
    const restartBtn = document.getElementById("restartBtn");
    const audioHint = document.getElementById("audioHint");

    function formatTime(sec) {
      sec = Math.max(0, Math.floor(sec));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function updateUI(playing) {
      isPlaying = playing;
      playIcon.style.display = playing ? "none" : "block";
      pauseIcon.style.display = playing ? "block" : "none";
      audioHint.textContent = playing
        ? "Playing audio · Backstreet Boys — Shape of My Heart 🎵"
        : "Paused · Klik Play untuk lanjut memutar audio 🔊";
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("yt-player", {
        height: "1",
        width: "1",
        videoId: VIDEO_ID,
        playerVars: { autoplay: 1, controls: 0, loop: 1, playlist: VIDEO_ID },
        events: {
          onReady: function (e) {
            playerReady = true;
            e.target.setVolume(85);
            e.target.playVideo();
            if (userWantedPlay) {
              e.target.unMute();
              e.target.playVideo();
            }
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.PLAYING) updateUI(true);
            else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) updateUI(false);
          }
        }
      });
    };

    function togglePlay() {
      userWantedPlay = true;
      if (!playerReady || !player) return;
      if (isPlaying) player.pauseVideo();
      else {
        player.unMute();
        player.playVideo();
      }
    }

    playPauseBtn.addEventListener("click", function (e) { e.stopPropagation(); togglePlay(); });
    prevBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (playerReady && player) { player.seekTo(0, true); player.unMute(); player.playVideo(); }
    });
    restartBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (playerReady && player) { player.seekTo(72, true); player.unMute(); player.playVideo(); }
    });

    document.addEventListener("click", function () {
      userWantedPlay = true;
      if (!isPlaying && playerReady && player) {
        player.unMute();
        player.playVideo();
      }
    }, { once: true });

    progressBar.addEventListener("click", function (e) {
      e.stopPropagation();
      if (!playerReady || !player) return;
      const dur = player.getDuration() || 231;
      const rect = progressBar.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      player.seekTo(ratio * dur, true);
      if (!isPlaying) { player.unMute(); player.playVideo(); }
    });

    setInterval(function () {
      if (!playerReady || !player || typeof player.getCurrentTime !== "function") return;
      const cur = player.getCurrentTime() || 0;
      const dur = player.getDuration() || 231;
      const pct = dur > 0 ? Math.min(100, (cur / dur) * 100) : 0;
      progressFill.style.width = pct.toFixed(2) + "%";
      elapsedTime.textContent = formatTime(cur);
      remainingTime.textContent = "-" + formatTime(Math.max(0, dur - cur));

      let activeText = LYRICS[0][1];
      for (let i = 0; i < LYRICS.length; i++) {
        if (cur >= LYRICS[i][0]) activeText = LYRICS[i][1];
      }
      if (lyricLine.textContent !== activeText) {
        lyricLine.textContent = activeText;
      }
    }, 250);
  </script>
</body>
</html>
