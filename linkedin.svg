<svg xmlns="http://www.w3.org/2000/svg" width="260" height="78" viewBox="0 0 260 78" role="img" aria-label="LINKEDIN">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="rgbEdge" gradientUnits="userSpaceOnUse" x1="0" y1="39" x2="260" y2="39">
      <stop offset="0%" stop-color="#FF0000">
        <animate attributeName="stop-color" values="#FF0000;#FFFF00;#00FF00;#00FFFF;#0000FF;#FF00FF;#FF0000" dur="3.4s" begin="0.0s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" stop-color="#00FF00">
        <animate attributeName="stop-color" values="#00FF00;#00FFFF;#0000FF;#FF00FF;#FF0000;#FFFF00;#00FF00" dur="3.4s" begin="0.0s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" stop-color="#0000FF">
        <animate attributeName="stop-color" values="#0000FF;#FF00FF;#FF0000;#FFFF00;#00FF00;#00FFFF;#0000FF" dur="3.4s" begin="0.0s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#FF0000;#FFFF00;#00FF00;#00FFFF;#0000FF;#FF00FF" dur="3.4s" begin="0.0s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 130 39" to="360 130 39" dur="3.4s" begin="0.0s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <clipPath id="clip">
      <rect x="2" y="2" width="256" height="74" rx="12"/>
    </clipPath>

    <pattern id="grid" width="13" height="13" patternUnits="userSpaceOnUse">
      <path d="M13 0H0V13" fill="none" stroke="#38bdf8" stroke-width="0.4" opacity="0.06"/>
    </pattern>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00FFFF" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="256" height="74" rx="12" fill="url(#bg)"/>
  <rect x="2" y="2" width="256" height="74" rx="12" fill="url(#grid)"/>

  <g filter="url(#glow)">
    <rect x="2" y="2" width="256" height="74" rx="12"
          fill="none" stroke="url(#rgbEdge)" stroke-width="3" opacity="0.95"/>
  </g>

  <g clip-path="url(#clip)">
    <rect x="-260" y="0" width="260" height="78" fill="url(#sweep)">
      <animate attributeName="x" from="-260" to="260" dur="4.2s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g stroke="#38bdf8" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M10 20V13a3 3 0 0 1 3-3h7"/>
    <path d="M250 20V13a3 3 0 0 0-3-3h-7"/>
    <path d="M10 58v7a3 3 0 0 0 3 3h7"/>
    <path d="M250 58v7a3 3 0 0 1-3 3h-7"/>
  </g>

  <g transform="translate(24 27.0)">
    <g filter="url(#soft)" opacity="0.75">
      <rect x="1.5" y="1.5" width="21" height="21" rx="3.5" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
      <circle cx="6.6" cy="6.7" r="1.5" fill="#38bdf8"/>
      <rect x="5.5" y="10" width="2.3" height="8" rx="0.4" fill="#38bdf8"/>
      <path d="M10.8 18v-8h2.2v1.1a3 3 0 0 1 5.2 2.1V18h-2.3v-4.3a1.5 1.5 0 0 0-3 0V18z" fill="#38bdf8"/>
    </g>
    <rect x="1.5" y="1.5" width="21" height="21" rx="3.5" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
    <circle cx="6.6" cy="6.7" r="1.5" fill="#38bdf8"/>
    <rect x="5.5" y="10" width="2.3" height="8" rx="0.4" fill="#38bdf8"/>
    <path d="M10.8 18v-8h2.2v1.1a3 3 0 0 1 5.2 2.1V18h-2.3v-4.3a1.5 1.5 0 0 0-3 0V18z" fill="#38bdf8"/>
  </g>

  <text x="66" y="35.0" font-family="'Fira Code','JetBrains Mono',ui-monospace,monospace"
        font-size="14.5" font-weight="700" letter-spacing="2.4" fill="#ffffff">LINKEDIN</text>

  <g>
    <circle cx="70" cy="52.0" r="2.6" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
    <text x="79" y="56.0" font-family="'Fira Code',ui-monospace,monospace"
          font-size="9.5" letter-spacing="1.6" fill="#94a3b8">CONNECTED</text>
  </g>

  <g stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 34.0 l5 5 -5 5">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" begin="0.0s" repeatCount="indefinite"/>
    </path>
    <path d="M232 34.0 l5 5 -5 5" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.2s" begin="0.25s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
