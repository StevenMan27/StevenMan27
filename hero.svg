<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Christian Steven Manurung - Full-Stack Web Developer &amp; Software Engineering Student">
<defs>
<style>
  .name { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 3px; fill: #ffffff; }
  .sub { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; font-size: 14.5px; letter-spacing: 1.2px; fill: #38bdf8; }
  .edu { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 12.5px; letter-spacing: 1px; fill: #94a3b8; }
  .ach { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; font-size: 16.5px; fill: #22d3ee; }
  .status-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 13.5px; letter-spacing: 2px; fill: #ffffff; }
  .corner { stroke: #38bdf8; stroke-width: 1.6; fill: none; opacity: 0.85; stroke-linecap: round; }
  .grid { stroke: #ffffff; stroke-opacity: 0.03; stroke-width: 1; }
  .glowbar { animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes scan {
    0% { transform: translateY(-44px); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(390px); opacity: 0; }
  }
  @keyframes glitch {
    0%, 94%, 100% { transform: translate(0,0); opacity: 0; }
    95% { transform: translate(-2.5px,0.8px); opacity: 0.55; }
    97% { transform: translate(2.5px,-0.8px); opacity: 0.55; }
    98.5% { transform: translate(-1.5px,0); opacity: 0.35; }
  }
</style>

<radialGradient id="bgGradHero" cx="50%" cy="20%" r="90%">
  <stop offset="0%" stop-color="#161B22"/>
  <stop offset="55%" stop-color="#0D1117"/>
  <stop offset="100%" stop-color="#090C10"/>
</radialGradient>

<radialGradient id="vignetteHero" cx="50%" cy="50%" r="75%">
  <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.48"/>
</radialGradient>

<linearGradient id="rgbBorderHero" gradientUnits="userSpaceOnUse" x1="12" y1="190" x2="888" y2="190">
  <stop offset="0%" stop-color="#FF0055">
    <animate attributeName="stop-color" values="#FF0055;#FFAA00;#00FF88;#00E5FF;#6366F1;#FF00AA;#FF0055" dur="6s" repeatCount="indefinite"/>
  </stop>
  <stop offset="25%" stop-color="#FFAA00">
    <animate attributeName="stop-color" values="#FFAA00;#00FF88;#00E5FF;#6366F1;#FF00AA;#FF0055;#FFAA00" dur="6s" repeatCount="indefinite"/>
  </stop>
  <stop offset="50%" stop-color="#00FF88">
    <animate attributeName="stop-color" values="#00FF88;#00E5FF;#6366F1;#FF00AA;#FF0055;#FFAA00;#00FF88" dur="6s" repeatCount="indefinite"/>
  </stop>
  <stop offset="75%" stop-color="#00E5FF">
    <animate attributeName="stop-color" values="#00E5FF;#6366F1;#FF00AA;#FF0055;#FFAA00;#00FF88;#00E5FF" dur="6s" repeatCount="indefinite"/>
  </stop>
  <stop offset="100%" stop-color="#FF00AA">
    <animate attributeName="stop-color" values="#FF00AA;#FF0055;#FFAA00;#00FF88;#00E5FF;#6366F1;#FF00AA" dur="6s" repeatCount="indefinite"/>
  </stop>
  <animateTransform attributeName="gradientTransform" type="rotate" from="0 450 190" to="360 450 190" dur="4s" repeatCount="indefinite"/>
</linearGradient>

<linearGradient id="scanGradHero" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.06"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<filter id="neonOuterHero" x="-10%" y="-15%" width="120%" height="130%">
  <feGaussianBlur stdDeviation="5.5" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<filter id="neonInnerHero" x="-10%" y="-15%" width="120%" height="130%">
  <feGaussianBlur stdDeviation="2" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<filter id="glowTextHero" x="-30%" y="-40%" width="160%" height="180%">
  <feGaussianBlur stdDeviation="3.5" result="blur"/>
  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<clipPath id="cardClipHero">
  <rect x="12" y="12" width="876" height="356" rx="16"/>
</clipPath>

<!-- Symmetric center-expanding clipPaths so text is ALWAYS centered at x=450 -->
<clipPath id="clip1">
  <rect x="450" y="216" width="0" height="30">
    <animate attributeName="x" values="450;200;200;450;450" keyTimes="0;0.08;0.27;0.33;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;500;500;0;0" keyTimes="0;0.08;0.27;0.33;1" dur="12s" repeatCount="indefinite"/>
  </rect>
</clipPath>
<clipPath id="clip2">
  <rect x="450" y="216" width="0" height="30">
    <animate attributeName="x" values="450;450;150;150;450;450" keyTimes="0;0.33;0.41;0.60;0.66;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;0;600;600;0;0" keyTimes="0;0.33;0.41;0.60;0.66;1" dur="12s" repeatCount="indefinite"/>
  </rect>
</clipPath>
<clipPath id="clip3">
  <rect x="450" y="216" width="0" height="30">
    <animate attributeName="x" values="450;450;200;200;450" keyTimes="0;0.66;0.74;0.94;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;0;500;500;0" keyTimes="0;0.66;0.74;0.94;1" dur="12s" repeatCount="indefinite"/>
  </rect>
</clipPath>
</defs>

<!-- outer neon shadow & ambient aura -->
<rect x="12" y="12" width="876" height="356" rx="16" fill="none" stroke="url(#rgbBorderHero)" stroke-width="5.5" opacity="0.32" filter="url(#neonOuterHero)"/>
<rect x="12" y="12" width="876" height="356" rx="16" fill="none" stroke="url(#rgbBorderHero)" stroke-width="2.6" opacity="0.55" filter="url(#neonInnerHero)"/>

<!-- dark glass card body -->
<rect x="12" y="12" width="876" height="356" rx="16" fill="url(#bgGradHero)"/>
<rect x="12" y="12" width="876" height="356" rx="16" fill="url(#vignetteHero)"/>

<!-- subtle grid & scanline inside card -->
<g clip-path="url(#cardClipHero)">
  <line class="grid" x1="12" y1="72" x2="888" y2="72"/>
  <line class="grid" x1="12" y1="190" x2="888" y2="190"/>
  <line class="grid" x1="12" y1="308" x2="888" y2="308"/>
  <rect x="12" y="12" width="876" height="40" fill="url(#scanGradHero)" style="animation: scan 6.5s linear infinite;"/>
</g>

<!-- razor-thin crisp rotating RGB border + smooth comet -->
<rect x="12" y="12" width="876" height="356" rx="16" fill="none" stroke="url(#rgbBorderHero)" stroke-width="1.8" opacity="0.95"/>
<rect x="12" y="12" width="876" height="356" rx="16" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.5" pathLength="1000" stroke-dasharray="90 910" filter="url(#neonInnerHero)">
  <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- corner brackets -->
<path class="corner" d="M30 58 L30 30 L58 30"/>
<path class="corner" d="M870 58 L870 30 L842 30"/>
<path class="corner" d="M30 322 L30 350 L58 350"/>
<path class="corner" d="M870 322 L870 350 L842 350"/>

<!-- title + subtle glitch -->
<text x="450" y="108" text-anchor="middle" class="name" filter="url(#glowTextHero)">CHRISTIAN STEVEN MANURUNG</text>
<text x="448" y="108" text-anchor="middle" class="name" fill="#00E5FF" style="animation: glitch 7s infinite;">CHRISTIAN STEVEN MANURUNG</text>
<text x="452" y="108" text-anchor="middle" class="name" fill="#FF0055" style="animation: glitch 7s infinite .12s;">CHRISTIAN STEVEN MANURUNG</text>

<text x="450" y="144" text-anchor="middle" class="sub">FULL-STACK WEB DEVELOPER &amp; SOFTWARE ENGINEERING STUDENT</text>

<rect class="glowbar" x="380" y="162" width="140" height="2" rx="1" fill="url(#rgbBorderHero)" filter="url(#glowTextHero)"/>

<text x="450" y="196" text-anchor="middle" class="edu">NIM: 41425031  &#183;  SEMESTER 3 D4 TRPL  &#183;  INSTITUT TEKNOLOGI DEL</text>

<!-- Strictly centered rotating texts -->
<text x="450" y="236" text-anchor="middle" class="ach" clip-path="url(#clip1)" opacity="0">NIM : 41425031 - SEM 3<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.27;0.33;1" dur="12s" repeatCount="indefinite"/></text>
<text x="450" y="236" text-anchor="middle" class="ach" clip-path="url(#clip2)" opacity="0">D4 TEKNOLOGI REKAYASA PERANGKAT LUNAK<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.60;0.66;1" dur="12s" repeatCount="indefinite"/></text>
<text x="450" y="236" text-anchor="middle" class="ach" clip-path="url(#clip3)" opacity="0">INSTITUT TEKNOLOGI DEL<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.69;0.94;1" dur="12s" repeatCount="indefinite"/></text>

<!-- open to work badge with seamless trace -->
<g>
  <rect x="356" y="280" width="188" height="42" rx="10" fill="none" stroke="url(#rgbBorderHero)" stroke-width="3" opacity="0.35" filter="url(#neonInnerHero)"/>
  <rect x="356" y="280" width="188" height="42" rx="10" fill="#161B22" stroke="url(#rgbBorderHero)" stroke-width="1.4"/>
  <rect x="356" y="280" width="188" height="42" rx="10" fill="none" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" pathLength="300" stroke-dasharray="48 252" filter="url(#glowTextHero)">
    <animate attributeName="stroke-dashoffset" from="0" to="-300" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <circle cx="378" cy="301" r="4" fill="#22c55e"/>
  <circle cx="378" cy="301" r="4" fill="none" stroke="#22c55e" stroke-width="1.5">
    <animate attributeName="r" values="4;9" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="454" y="306" text-anchor="middle" class="status-text">OPEN TO WORK</text>
</g>
</svg>
